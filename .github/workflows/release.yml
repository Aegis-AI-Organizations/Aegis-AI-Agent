name: Module - Auto Release
on: workflow_call

jobs:
  build_static_binary:
    name: Build Static Binary (MUSL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Cross
        run: cargo install cross --version 0.2.5

      - name: Build Static Binary
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ai-agent-static
          path: target/x86_64-unknown-linux-musl/release/aegis-ai-agent

  create_release:
    name: GitHub Auto-Release & Docker Push
    needs: build_static_binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis-ai-agent-static
          path: ./

      - name: Prepare Lowercase Image Name
        id: prep
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image_name=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Generate Auto Tag
        id: tag_gen
        run: echo "tag=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ steps.tag_gen.outputs.tag }}
            ${{ steps.prep.outputs.image_name }}:latest

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag }}
          name: Release ${{ steps.tag_gen.outputs.tag }}
          files: |
            aegis-ai-agent
            install.sh
          generate_release_notes: true

      - name: Upload Static Binary to MinIO Releases Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # Releases remain valid when the optional public mirror is not configured.
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "MinIO release credentials are not configured; skipping upload."
            exit 0
          fi
          aws s3 cp aegis-ai-agent s3://releases/aegis-ai-agent --endpoint-url https://storage.aegis-ai.fr
