name: Aegis AI Automation

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  automate-project:
    name: Automate Project Linking and Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Get Project Metadata (GraphQL)
        id: project_info
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          # Fetch both ID and Number (item-add needs Number, item-edit needs ID)
          QUERY='query($org: String!) { organization(login: $org) { projectsV2(first: 20) { nodes { id number title } } } }'
          PROJECT_DATA=$(gh api graphql -f org="Aegis-AI-Organizations" -f query="$QUERY" -q '.data.organization.projectsV2.nodes[] | select(.title == "Aegis AI")')
          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.id')
          PROJECT_NUMBER=$(echo "$PROJECT_DATA" | jq -r '.number')
          if [ -z "$PROJECT_ID" ]; then
            echo "Error: Project 'Aegis AI' not found."
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "project_number=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          # Add the item using the PROJECT_NUMBER
          GH_URL="${{ github.event.issue.html_url || github.event.pull_request.html_url || 'https://github.com/Aegis-AI-Organizations/Aegis-AI-Agent/issues/20' }}"
          ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --org Aegis-AI-Organizations --url "$GH_URL" --format json -q '.id')
          echo "item_id=$ITEM_ID" >> $GITHUB_OUTPUT

      - name: Auto-Assign Author
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue ? context.issue.number : (context.payload.pull_request ? context.payload.pull_request.number : 20);
            const actor = context.actor;
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: [actor]
            });

      - name: Set Project Fields
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
          ITEM_ID: ${{ steps.project_info.outputs.item_id }}
          PROJECT_ID: ${{ steps.project_info.outputs.project_id }}
        run: |
          # 1. Set Status based on event type
          STATUS_OPTION="Ready"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            STATUS_OPTION="In review"
          fi
          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field "Status" --single-select-option "$STATUS_OPTION"
          # 2. Dynamic Component detection
          REPO_NAME="${{ github.event.repository.name }}"
          COMPONENT="Other"
          if [[ "$REPO_NAME" == *"Agent"* ]]; then COMPONENT="Agent (Rust)"; fi
          if [[ "$REPO_NAME" == *"Gateway"* ]]; then COMPONENT="Gateway (Go)"; fi
          if [[ "$REPO_NAME" == *"Brain"* ]]; then COMPONENT="Brain (Python)"; fi
          if [[ "$REPO_NAME" == *"Dashboard"* ]]; then COMPONENT="Dashboard (Web)"; fi
          if [[ "$REPO_NAME" == *"Documentation"* ]]; then COMPONENT="Documentation"; fi
          if [[ "$REPO_NAME" == *"Infra"* ]]; then COMPONENT="Infrastructure (K8s)"; fi
          if [[ "$REPO_NAME" == *"Landing"* ]]; then COMPONENT="Landing Page"; fi
          if [[ "$REPO_NAME" == *"Proto"* ]]; then COMPONENT="Contracts (Proto)"; fi
          if [[ "$REPO_NAME" == *"Worker-Ingest"* ]]; then COMPONENT="Worker (Ingest)"; fi
          if [[ "$REPO_NAME" == *"Worker-Deployer"* ]]; then COMPONENT="Worker (Deployer)"; fi
          if [[ "$REPO_NAME" == *"Worker-Fixer"* ]]; then COMPONENT="Worker (Fixer)"; fi
          if [[ "$REPO_NAME" == *"Worker-Pentest"* ]]; then COMPONENT="Worker (Pentest)"; fi
          if [[ "$REPO_NAME" == *"Internal"* ]]; then COMPONENT="Internal Tools"; fi
          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field "Components" --single-select-option "$COMPONENT"

      - name: Update Description
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          # Get COMPONENT again
          REPO_NAME="${{ github.event.repository.name }}"
          COMPONENT="Other"
          if [[ "$REPO_NAME" == *"Agent"* ]]; then COMPONENT="Agent (Rust)"; fi
          if [[ "$REPO_NAME" == *"Gateway"* ]]; then COMPONENT="Gateway (Go)"; fi
          if [[ "$REPO_NAME" == *"Brain"* ]]; then COMPONENT="Brain (Python)"; fi
          if [[ "$REPO_NAME" == *"Dashboard"* ]]; then COMPONENT="Dashboard (Web)"; fi
          if [[ "$REPO_NAME" == *"Documentation"* ]]; then COMPONENT="Documentation"; fi
          if [[ "$REPO_NAME" == *"Infra"* ]]; then COMPONENT="Infrastructure (K8s)"; fi
          if [[ "$REPO_NAME" == *"Landing"* ]]; then COMPONENT="Landing Page"; fi
          if [[ "$REPO_NAME" == *"Proto"* ]]; then COMPONENT="Contracts (Proto)"; fi
          if [[ "$REPO_NAME" == *"Worker-Ingest"* ]]; then COMPONENT="Worker (Ingest)"; fi
          if [[ "$REPO_NAME" == *"Worker-Deployer"* ]]; then COMPONENT="Worker (Deployer)"; fi
          if [[ "$REPO_NAME" == *"Worker-Fixer"* ]]; then COMPONENT="Worker (Fixer)"; fi
          if [[ "$REPO_NAME" == *"Worker-Pentest"* ]]; then COMPONENT="Worker (Pentest)"; fi
          if [[ "$REPO_NAME" == *"Internal"* ]]; then COMPONENT="Internal Tools"; fi
          GH_NUMBER="${{ github.event.issue.number || github.event.pull_request.number || 20 }}"
          BODY=$(gh issue view "$GH_NUMBER" --json body -q .body 2>/dev/null || gh pr view "$GH_NUMBER" --json body -q .body)
          CLEAN_COMP=$(echo "$COMPONENT" | sed 's/[()]//g' | cut -d' ' -f1)
          NEW_BODY=$(echo "$BODY" | sed "s/\[ \] \(.*$CLEAN_COMP.*\)/\[x\] \1/g")
          if [[ "$NEW_BODY" != "$BODY" ]]; then
            gh issue edit "$GH_NUMBER" --body "$NEW_BODY" 2>/dev/null || gh pr edit "$GH_NUMBER" --body "$NEW_BODY"
          fi