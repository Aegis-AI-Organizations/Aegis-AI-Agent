name: Module - Build & Test
on: workflow_call

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Build
        run: if [ -f Cargo.toml ]; then cargo build --verbose; else echo "No Cargo.toml, skipping"; fi
      - name: Build static Linux binary (MUSL)
        run: |
          if [ -f Cargo.toml ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            cargo build --verbose --target x86_64-unknown-linux-musl --bin aegis-ai-agent --no-default-features --features k8s,docker
          else
            echo "No Cargo.toml, skipping"
          fi
      - name: Run tests with coverage
        run: |
          if [ -f Cargo.toml ]; then
            cargo tarpaulin --verbose --engine llvm --timeout 120 --fail-under 70 --exclude-files src/main.rs --out Xml
          else
            echo "No Cargo.toml, skipping"
          fi
