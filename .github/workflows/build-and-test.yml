name: Module - Build & Test
on: workflow_call

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Build
        run: if [ -f Cargo.toml ]; then cargo build --verbose; else echo "No Cargo.toml, skipping"; fi
      - name: Run tests with coverage
        run: |
          if [ -f Cargo.toml ]; then
            cargo tarpaulin --verbose --engine llvm --timeout 120 --fail-under 80 --exclude-files src/main.rs --out Xml
          else
            echo "No Cargo.toml, skipping"
          fi
