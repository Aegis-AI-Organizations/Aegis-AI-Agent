[package]
name = "aegis-ai-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
thiserror = "2.0.18"
sysinfo = "0.38.4"
chrono = "0.4"
kube = { version = "3.1.0", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
bollard = "0.18.1"

[dev-dependencies]
mockito = "1.4"
tower = { version = "0.4", features = ["util"] }
http = "1.0"
serial_test = "3.1"
tempfile = "3.27.0"
