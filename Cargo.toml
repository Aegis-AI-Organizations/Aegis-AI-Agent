[package]
name = "aegis-ai-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
anyhow = "1.0"

[dev-dependencies]
mockito = "1.4"
tower = { version = "0.4", features = ["util"] }
http = "1.0"
serial_test = "3.1"
