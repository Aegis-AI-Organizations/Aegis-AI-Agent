apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aegis-agent.fullname" . }}
  labels:
    {{- include "aegis-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "aegis-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "aegis-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GATEWAY_URL
              value: {{ .Values.gatewayUrl | quote }}
            - name: DEPLOYMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegis-agent.fullname" . }}-secret
                  key: token
            - name: INGEST_HOST
              value: {{ .Values.ingestHost | quote }}
            - name: INGEST_PORT
              value: {{ .Values.ingestPort | quote }}
            - name: AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_SECRET_FILE_OVERRIDE
              value: "/var/lib/aegis-agent/agent_secret.json"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: var-lib-aegis
              mountPath: /var/lib/aegis-agent
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: var-lib-aegis
          hostPath:
            path: /var/lib/aegis-agent
            type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
