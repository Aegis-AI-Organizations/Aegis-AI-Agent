# Default values for aegis-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/aegis-ai-organizations/aegis-ai-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Aegis AI Gateway and Ingest configurations
gatewayUrl: "https://api.aegis-ai.fr"
ingestHost: "aegis-worker-ingest.aegis-system.svc.cluster.local"
ingestPort: 7233

# Security Token (Required)
# Must be passed dynamically during installation: --set token=XYZ
token: ""

# DaemonSet pods resources config
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Tolerations to allow running on control-plane nodes
tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute

# Node Selector & Affinity
nodeSelector: {}
affinity: {}
